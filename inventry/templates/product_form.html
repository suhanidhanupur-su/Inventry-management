{% extends 'base.html' %}

{% block content %}

<div class="container-box col-md-6 mx-auto">
    <h2 class="text-center mb-4">Product Form</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-custom w-100">Save Product</button>
    </form>
</div>

{% endblock %}
