{% extends 'base.html' %}

{% block content %}

<h1 class="text-center mb-4">All Products</h1>

<div class="row">
    {% for product in products %}

    <div class="col-md-4 mb-4">
        <div class="card p-3 h-100">

            <img src="{{ product.image.url }}" class="product-img w-100">

            <div class="card-body">
                <h3>{{ product.name }}</h3>

                <p><strong>Price:</strong> ₹{{ product.price }}</p>
                <p><strong>Quantity:</strong> {{ product.quantity }}</p>
                <p>{{ product.description }}</p>

                {% if user.is_authenticated %}
                    <a href="{% url 'edit_product' product.id %}" class="btn btn-primary">Edit</a>

                    <a href="{% url 'delete_product' product.id %}" class="btn btn-danger">Delete</a>
                {% else %}
                    <button class="btn btn-secondary" disabled>Edit</button>
                    <button class="btn btn-secondary" disabled>Delete</button>
                {% endif %}
            </div>
        </div>
    </div>

    {% endfor %}
</div>

{% endblock %}
